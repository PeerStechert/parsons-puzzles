
<h1>Parsons Practice</h1>

<h2>Temperatur-Puzzle</h2>

<div id="p1-sortableTrash" class="sortable-code"></div>
<div id="p1-sortable" class="sortable-code"></div>
<div style="clear:both;"></div>
<p>
  <input id="p1-feedbackLink" value="Get Feedback" type="button" />
  <input id="p1-newInstanceLink" value="Reset Problem" type="button" />
</p>

<script>
(function(){
  var initial =
    "temperature = float(input(\"Bitte geben Sie die aktuelle Temperatur ein: \"))\n" +
    "\n" +
    "if temperature < 20 :\n" +
    "    print(\"Es ist zu kalt.\")\n" +
    "elif temperature > 25 :\n" +
    "    print(\"Es ist zu heiß\")\n" +
    "else :\n" +
    "    print(\"Es ist angenehm warm.\")";

  var parsonsPuzzle = new ParsonsWidget({
    sortableId: "p1-sortable",
    trashId: "p1-sortableTrash",
    max_wrong_lines: 10,
    grader: ParsonsWidget._graders.LineBasedGrader,
    exec_limit: 2500,
    can_indent: true,
    x_indent: 50,
    lang: "en",
    show_feedback: true,
    python3: true
  });

  parsonsPuzzle.init(initial);
  parsonsPuzzle.shuffleLines();

  $("#p1-newInstanceLink").click(function(e){ e.preventDefault(); parsonsPuzzle.shuffleLines(); });
  $("#p1-feedbackLink").click(function(e){ e.preventDefault(); parsonsPuzzle.getFeedback(); });
})();
</script>
